<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/dominoes.css"><link rel="stylesheet" href="../css/dominoes-table.css"></head><body class="dominoes-playing"><main><nav class="page-nav"><a>← Game room</a><button data-install>Install Game Room</button></nav><div class="room-bar"><h2>Room A7K2Q9</h2><button>Copy invite</button><button>Back</button></div><p id="status"></p><div class="felt"><div id="ends" class="ends"></div><div id="board" class="board"></div></div><div id="hand" class="hand"></div><button id="pass">Pass</button><div id="choice" hidden><p>Play on which end?</p><button>Left</button><button>Right</button><button>Cancel</button></div></main><script type="module">
import {tileNode,createTable} from '../js/dominoes-table.js';
const $=id=>document.getElementById(id);window.playChoices=0;
window.state={room:'fixture',code:'A7K2Q9',handNumber:3,me:0,turn:1,phase:'playing',scores:[2,1,3,4],players:[{name:'Mainframe'},{name:'Chris'},{name:'Joel'},{name:'Geoff'}],counts:[7,4,4,4],hand:[[0,6],[1,4],[2,5],[3,3],[4,6],[0,5],[1,6]],board:[[5,5],[5,6],[6,6],[6,3],[3,0],[0,1],[1,2],[2,2],[2,4]],events:[{action:'play',tile:[6,6]}],history:[{hand:1,winner:2,scores:[0,0,1,0]},{hand:2,winner:0,scores:[1,0,1,0]}]};
const paint=createTable({board:$('board'),hand:$('hand'),pass:$('pass'),choice:$('choice'),status:$('status')});
window.render=()=>{
 $('status').textContent='Hand 3 · '+(state.turn===0?'Your turn':'Chris to play');$('ends').textContent='Open ends: 5 and 4';
 $('hand').replaceChildren(...state.hand.map(tile=>{const el=tileNode(tile,true);el.disabled=state.turn!==0;el.onclick=()=>{window.playChoices++;$('choice').hidden=false;};return el;}));paint(state);
};window.render();window.ready=true;
</script></body></html>
